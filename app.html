<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0616" />
<title>ChemVeda Pro 2026-27 — Hybrid Fast</title>
<meta name="description" content="Chemistry Test Series - Now 10x faster with CDN + Offline support">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
<link rel="manifest" href="./manifest.json">
<!-- Preload critical data -->
<link rel="preload" href="./data/feed.json" as="fetch" crossorigin>
<link rel="preload" href="./data/tests/index.json" as="fetch" crossorigin>
<style>
/* Critical above-the-fold */
#app{min-height:100vh}
.loading-hybrid{position:fixed;inset:0;display:grid;place-items:center;background:#0a0616;z-index:50}
.loading-hybrid .box{text-align:center}
.loading-hybrid .bar{width:120px;height:3px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:12px auto 0}
.loading-hybrid .bar-fill{height:100%;width:40%;background:linear-gradient(90deg,#a259ff,#22c55e);animation:loadMove 1s ease-in-out infinite}
@keyframes loadMove{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.badge-src{font-size:.62rem;padding:2px 6px;border-radius:999px;background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.25);color:#4ade80;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="grain"></div>
<div id="app">
  <div class="loading-hybrid" id="initialLoader">
    <div class="box">
      <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#a259ff,#22c55e);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:800;color:#fff;margin:0 auto 12px">CV</div>
      <div style="font-family:'Space Grotesk';font-weight:600">Loading ChemVeda...</div>
      <div style="font-size:.78rem;color:#a89ec7;margin-top:4px">⚡ CDN + Offline ready</div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toasts" data-testid="toast-region" aria-live="polite"></div>

<script type="module">
// Remove initial loader when app renders
const observer = new MutationObserver(() => {
  const app = document.getElementById('app');
  const loader = document.getElementById('initialLoader');
  if (app && loader && app.children.length > 1) {
    loader.style.opacity = '0';
    loader.style.transition = 'opacity .4s';
    setTimeout(()=>loader.remove(), 400);
    observer.disconnect();
  }
});
observer.observe(document.getElementById('app'), { childList: true, subtree: true });

// Register SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
